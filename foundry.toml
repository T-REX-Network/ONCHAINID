[profile.default]
src = "contracts"
out = "out"
test = "test"
script = "scripts"
libs = ["dependencies"]

solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true

evm_version = "cancun"

fs_permissions = [{ access = "read", path = "test/vendored" }]

[profile.default.fmt]
sort_imports = true
contract_new_lines = true
bracket_spacing = true

[profile.default.lint]
lint_on_build = true

[rpc_endpoints]
baseSepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

[soldeer]
remappings_regenerate = false

[dependencies]
forge-std = { version = "v1.14.0", git = "https://github.com/foundry-rs/forge-std.git", tag = "v1.14.0" }
"@openzeppelin-contracts" = { version = "5.7.0-rc.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", tag = "v5.7.0-rc.0" }
"@openzeppelin-contracts-upgradeable" = { version = "5.7.0-rc.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git", tag = "v5.7.0-rc.0" }
"@openzeppelin-accounts" = { version = "0.0.0-e4c2a32a", git = "https://github.com/OpenZeppelin/openzeppelin-accounts.git", rev = "e4c2a32ad7378741a3cc4f2030f7d21d5ac53d28" }
