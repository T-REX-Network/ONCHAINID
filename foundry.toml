[profile.default]
src = "contracts"
out = "out"
test = "test"
script = "scripts"
libs = ["dependencies"]

solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# Required by `IdentityFactory.createIdentityWithSignature`: the function's 9
# calldata parameters (account, identityType, salt, keys, modules, nonce,
# expiry, signature + the implicit `msg.sender`) saturate Solidity's stack
# budget before any locals are introduced. via-ir's improved register
# allocation handles it cleanly. No other contract in the repo requires it.
via_ir = true
evm_version = "cancun"

[profile.default.fmt]
sort_imports = true
contract_new_lines = true
bracket_spacing = true

[profile.default.lint]
lint_on_build = true

[rpc_endpoints]
baseSepolia = "https://base-sepolia.g.alchemy.com/v2/${ALCHEMY_KEY}"
base = "https://base-mainnet.g.alchemy.com/v2/${ALCHEMY_KEY}"

[soldeer]
remappings_regenerate = false

[dependencies]
forge-std = { version = "v1.14.0", git = "https://github.com/foundry-rs/forge-std.git", tag = "v1.14.0" }
"@openzeppelin-contracts" = "5.6.0"
"@openzeppelin-contracts-upgradeable" = "5.6.0"
